spring.application.name=clausesumm

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clausesumm}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate / JPA configuration
# 'update' automatically modifies the DB schema to match your Java Entities during development.
spring.jpa.hibernate.ddl-auto=update

# Tells Hibernate to use PostgreSQL-specific features (like JSONB)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# OLLAMA CONFIGURATION
# ==========================================
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:deepseek-r1:14b}

# Sets the context window size (KV Cache limit) for the local model
spring.ai.ollama.chat.num-ctx=8192

# Temperature controls AI creativity. 
# 0.0 is MANDATORY for data extraction. You want strict, predictable facts, not creative writing.
spring.ai.ollama.chat.temperature=0.0

# ==========================================
# LOCAL OVERRIDE IMPORT
# ==========================================
# Tells Spring to load application-local.properties if it exists on the machine
spring.config.import=optional:classpath:application-local.properties
